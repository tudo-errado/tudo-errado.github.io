<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>smart control</title>
    <link rel="stylesheet" href="assets/style_2.css">
</head>

<body>
    <div class="container">
        <div class="login">
            <div class="logo">
                <img src="assets/images/logosmartcontrol.png" alt="logo_smartcontrol">
                <h2>Smart Control</h2>
            </div>

            <form action="dashboard.html" method="get">
                <div class="escrita">
                    <h1>Preencha os dados para acessar o sistema</h1>
                </div>

                <div class="input-box">
                    <i class="fa-solid fa-envelope"></i>
                    <label for="nome_completo">Nome completo</label>
                    <input type="text" name="nome_completo" id="nome_completo" placeholder="Digite se nome" required>
                </div>    

                <div class="input-box">
                    <i class="fa-solid fa-envelope"></i>
                    <label for="email">E-mail</label>
                    <input type="email" placeholder="E-mail" required>
                </div>

                <div class="input-box">
                    <i class="fa-solid fa-lock"></i>
                    <label for="email">Senha</label>
                    <input type="password" placeholder="Senha" required maxlength="8">
                </div>

                <div class="input-box">
                    <i class="fa-solid fa-lock"></i>
                    <label for="email">Confirmar Senha</label>
                    <input type="password" placeholder="Confirmar Senha" required minlength="8">
                </div>

                
                
                <button type="submit">Criar Conta</button>
                
                <p>
                    Já possui uma conta?
                    <a href="index.html">Faça Login aqui</a>
                </p>    
            </form>

        </div>

        <div class="imagem"></div>

    </div>

</body>

</html>
