<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>smat control</title>
</head>

<body>
    <header>
        <img src="assets/images/logo-smart.webp" alt="logo_smartcontrol" width="64" height="auto">
    </header>

    <h1>Cadastro de Usuário</h1>
    <h3>Preencha os dados para acessar o sistema</h3>
    <form action="dashboard.html" method="get">
        <label for="nome_completo">Nome completo</label>
        <input type="text" name="nome_completo" id="nome_completo" placeholder="Digite se nome" required>
        <label for="email">E-mail corporativo</label>
        <input type="email" name="email_corporativo" id="email" required>
        <label for="senha">Senha de acesso</label>
        <input type="password" name="senha" id="senha" required minlength="8">
        <button type="submit">Salvar Usuário</button>
        <button type="reset">Cancelar Operação</button>
        <input type="checkbox" name= "Concordo com os Termos de Uso" id="termos_uso" required>
        
        <select name="nivel de acesso" id="acesso" required>
            <option value="nivel 1"></option>
            <option value="nivel 2"></option>
            <option value="nivel 3"></option>
        </select>
        <label for="termos">Concordo com os Termos de Uso</label>
        <input type="checkbox" name= "termos_uso" id="termos" required>
        <button type="submit">Cadastrar</button>

        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d48651.97388975898!2d-71.01771586314374!3d24.99741123303544!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x89451ab5034cb7ab%3A0xb600ecf3df7aca4d!2sTri%C3%A2ngulo%20das%20Bermudas!5e0!3m2!1spt-BR!2sbr!4v1785242583547!5m2!1spt-BR!2sbr" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>

    </form>

</body>

</html>
