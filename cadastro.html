<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>smat control</title>
</head>

<body>
    <header>
        <img src="assets/images/1785238449947.png" alt="logo_smartcontrol">
    </header>
    
    <h1>Cadastro de Usuário</h1>
    <h3>Preencha os dados para acessar o sistema</h3>
    <form action="dashboard.html" method="get">
        <label for="nome_completo">Nome completo</label>
        <input type="text" name="nome_completo" id="nome_completo" placeholder="Digite se nome" required>
        <label for="email">E-mail corporativo</label>
        <input type="email" name="email_corporativo" id="email" required>
        <label for="senha">Senha de acesso</label>
        <input type="password" name="senha" id="senha" required minlength="8">
        <button type="submit">Salvar Usuário</button>
        <button type="reset">Cancelar Operação</button>
        <input type="checkbox" name= "Concordo com os Termos de Uso" id="termos_uso" required>
        
        <select name="nivel de acesso" id="acesso" required>
            <option value="nivel 1"></option>
            <option value="nivel 2"></option>
            <option value="nivel 3"></option>
        </select>
        <label for="termos">Concordo com os Termos de Uso</label>
        <input type="checkbox" name= "termos_uso" id="termos" required>
        <button type="submit">Cadastrar</button>

    </form>

</body>

</html>
