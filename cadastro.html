<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>smart control</title>
</head>

<body>
    <header>
        <img src="assets/images/logo-smart.webp" alt="logo_smartcontrol" width="64" height="auto">
    </header>

    <h1>Cadastro de Usuário</h1>
    <h3>Preencha os dados para acessar o sistema</h3>
    <form action="dashboard.html" method="get">
        <label for="nome_completo">Nome completo</label>
        <input type="text" name="nome_completo" id="nome_completo" placeholder="Digite se nome" required>
        <label for="email">E-mail corporativo</label>
        <input type="email" name="email_corporativo" id="email" required>
        <label for="senha">Senha de acesso</label>
        <input type="password" name="senha" id="senha" required minlength="8" placeholder="digite uma senha">
        <input type="password" name="senha" id="senha" required minlength="8" placeholder="confirmar senha">

        
        <select name="nivel de acesso" id="acesso" required>
            <option value="nivel 1">nivel 1</option>
            <option value="nivel 2">nivel 2</option>
            <option value="nivel 3">nivel 3</option>
        </select>

        <label for="termos">Concordo com os Termos de Uso</label>
        <input type="checkbox" name= "termos_uso" id="termos" required>
        <button type="submit">Cadastrar</button>

        <a href="index.html">Fazer login</a>

    </form>

</body>

</html>
