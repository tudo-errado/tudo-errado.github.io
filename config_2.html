<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartControl - Segurança</title>
    <link rel="stylesheet" href="assets/style_config_2.css">
</head>

<body>

    <div class="pagina-configuracoes">

        <header class="topbar">

            <div class="topbar-left">

                <button class="menu-button" id="menu-toggle" type="button">

                    <span></span>
                    <span></span>
                    <span></span>

                </button>

                <div class="brand-area">

                    <img
                        src="assets/images/logosmartcontrol.png"
                        class="brand-icon"
                        alt="">

                    <span class="brand-name">
                        <strong>Smart</strong><em>Control</em>
                    </span>

                </div>

            </div>

            <div class="page-title">
                Segurança
            </div>

            <div class="topbar-avatar">
                U
            </div>

        </header>


        <aside class="menu-configuracoes" id="menu-configuracoes">

            <a href="config_1.html" class="item-menu ativo">
                <span>▦</span>
                Informações
            </a>

            <a href="config_2.html" class="item-menu">
                <span>♧</span>
                Segurança
            </a>

            <a href="config_3.html" class="item-menu">
                <span>◉</span>
                Privacidade
            </a>

            <a href="config_4.html" class="item-menu">
                <span>🛒</span>
                Pagamento
            </a>

            <a href="index.html" class="item-menu sair">
                <span>⇥</span>
                Log Out
            </a>

        </aside>


        <main class="conteudo-configuracoes">

            <section class="cartao-configuracao">

                <h2>Segurança</h2>

                <div class="campo-senha">

                    <label>
                        Alterar Senha:
                    </label>

                    <small>
                        clique e aperte alterar senha
                    </small>

                    <input
                        type="password"
                        id="senha-atual"
                        placeholder="placeholder_text">

                </div>


                <div class="campo-senha">

                    <label>
                        Senha:
                    </label>

                    <input
                        type="password"
                        id="nova-senha"
                        placeholder="placeholder_text">

                </div>


                <div class="campo-senha">

                    <label>
                        Confirmar Senha:
                    </label>

                    <input
                        type="password"
                        id="confirmar-senha"
                        placeholder="placeholder_text">

                </div>


                <button
                    class="botao-alterar-senha"
                    id="alterar-senha">

                    Alterar Senha

                </button>

            </section>

        </main>

    </div>

    <script src="assets/configuracoes.js"></script>

</body>
</html>
