<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>smart control</title>
    <link rel="stylesheet" href="assets/style.css">
</head>

<body>
    <div class="container">
        <div class="login">
            <div class="logo">
                <img src="assets/images/logosmartcontrol.png" alt="logo_smartcontrol">
                <h2>Smart Control</h2>
            </div>
            
            <form action="dashboard.html" method="get">
                <div class="escrita">
                    <h1>Login</h1>
                </div>
                
                <div class="input-box">
                    <i class="fa-solid fa-envelope"></i>
                    <label for="email">E-mail</label>
                    <input type="email" placeholder="E-mail" required>
                </div>


                <div class="input-box">
                    <i class="fa-solid fa-lock"></i>
                    <label for="email">Senha</label>
                    <input type="password" placeholder="Senha" required minlength="8">
                </div>
                
                <a class="esqueceu" href="senha_1.html">Esqueceu a senha?</a>
                
                <button type="submit">Fazer login</button>

                <p>
                    Não possui uma conta?
                    <a href="cadastro.html">Crie uma aqui</a>
                </p>    

            </form>

        </div>

        <div class="imagem"></div>

    </div>

</body>

</html>
