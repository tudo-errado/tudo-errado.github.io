<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>smart control</title>
    <link rel="stylesheet" href="assets/style.css">
</head>

<body>
    <div class="container">
        <div class="login">
            <div class="logo">
                <img src="assets/images/logosmartcontrol.png" alt="logo_smartcontrol">
                <h2>Smart Control</h2>
            </div>
            
            <form action="dashboard.html" method="get" id="login-form">
                <div class="escrita">
                    <h1>Login</h1>
                </div>
                
                <div class="input-box">
                    <i class="fa-solid fa-envelope"></i>
                    <label for="email">E-mail</label>
                    <input type="email" id="login-email" placeholder="E-mail" required>
                </div>


                <div class="input-box">
                    <i class="fa-solid fa-lock"></i>
                    <label for="email">Senha</label>
                    <input type="password" id="login-senha" placeholder="Senha" required minlength="8">
                </div>
                
                <a class="esqueceu" href="senha_1.html">Esqueceu a senha?</a>
                
                <button type="submit">Fazer login</button>

                <p>
                    Não possui uma conta?
                    <a href="cadastro.html">Crie uma aqui</a>
                </p>    

            </form>

        </div>

        <div class="imagem"></div>

    </div>


    <script>
        document.getElementById('login-form')?.addEventListener('submit', function (e) {
            var usuarioSalvo = null;
            try { usuarioSalvo = JSON.parse(localStorage.getItem('smartcontrol_usuario')); } catch (err) {}

            if (!usuarioSalvo) {
                e.preventDefault();
                alert('Você ainda não tem uma conta. Vamos te levar para criar uma primeiro.');
                window.location.href = 'cadastro.html';
                return;
            }

            var email = document.getElementById('login-email').value.trim().toLowerCase();
            if (usuarioSalvo.email && email && usuarioSalvo.email.toLowerCase() !== email) {
                usuarioSalvo.email = email;
                localStorage.setItem('smartcontrol_usuario', JSON.stringify(usuarioSalvo));
            }
        });
    </script>
</body>

</html>
