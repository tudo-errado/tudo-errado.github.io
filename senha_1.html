<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar senha</title>
    <link rel="stylesheet" href="assets/style_3.1.css">
</head>
<body>
    <div class="container">
        <div class="login">

            <div class="logo">
                <img src="assets/images/logosmartcontrol.png" alt="logo_smartcontrol">
                <h2>Smart Control</h2>
            </div>

            <form action="senha_2.html" method="get">
                <div class="escrita">
                    <h1>Redefinição de senha</h1>
                </div>
                
                <div class="input-box">
                    <i class="fa-solid fa-envelope"></i>
                    <label for="email">Insira seu email para a recuperação da senha</label>
                    <input type="email" placeholder="E-mail" required>
                </div>

                <button type="submit">Avançar</button>
            
            </form>

        </div>

        <div class="imagem"></div>

    </div>

</body>
</html>
